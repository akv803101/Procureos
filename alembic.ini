# Alembic config.
#
# NOTE (Phase 1 decision — see migrations/README.md): the operative migration
# path for V1 is the raw-SQL runner `python -m migrations.apply`, because the
# schema is authored as plain .sql (matching bootstrap.md's numbered file list)
# and Supabase setup (RLS, storage, the auth.users table) is raw SQL anyway.
# This Alembic config is kept so future Python-based revisions are possible.
#
# The DB URL is read from SUPABASE_POSTGRES_URL at runtime by migrations/env.py;
# it is intentionally left blank here so no credentials live in version control.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
